# LunarLander-v3 requires the Box2D physics extra.
# Install it with: pip install "gymnasium[box2d]"
# LunarLander is much harder than CartPole. 50k timesteps is a starting point,
# not a promise of a good landing policy. Try 300k+ for stronger results.
version: 1
description: "LunarLander-v3 with native state observations and PPO."

game:
  name: lunarlander
  adapter: gymnasium
  params:
    env_id: LunarLander-v3
  render_mode: null
  seed: 42

observation:
  mode: state
  width: 84
  height: 84
  stack: 1
  normalize: false

actions:
  frame_skip: 1
  duration: 0.0
  max_duration: 1.0
  bindings: []

reward:
  components:
    - type: native
      scale: 1.0
      name: lunarlander_reward
  clip: null

episode:
  max_steps: 1000
  terminate_on: null

training:
  algorithm: ppo
  timesteps: 50000
  seed: 42
  policy: null
  learning_rate: 0.0003
  gamma: 0.995
  n_steps: 512
  batch_size: 128
  n_epochs: 10
  gae_lambda: 0.98
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  n_envs: 4
  checkpoint_freq: 10000
  eval_freq: 10000
  n_eval_episodes: 3
  save_best: true
  tensorboard: true
  device: auto
  verbose: 1
  progress_bar: false
  stats_window_size: 100
  subproc: false
  extra_params: {}
